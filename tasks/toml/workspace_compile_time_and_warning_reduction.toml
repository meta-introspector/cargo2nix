name = "Workspace Compile Time and Warning Reduction"
description = "Achieve minimal compile times and zero warnings across the entire workspace by systematically addressing compilation bottlenecks, abstracting heavy dependencies, replacing interpreted scripts with native Rust, and leveraging advanced caching mechanisms."
status = "in-progress"
depends_on = [
    "abstract_git_operations.toml",
    "replace_shell_scripts_with_rust.toml",
    "implement_file_system_monitoring_and_hashing.toml",
    "implement_solana_pda_program_for_rollup_lock.toml",
    "integrate_rollup_lock_with_cargo_repo_sync.toml",
    "optimize_git_status_cache.toml"
]
steps = [
    "Conduct a comprehensive analysis of current compile times and identify major bottlenecks (e.g., `cargo build --timings`).",
    "Implement and integrate the `GitExecutor` trait to make `git2` an optional dependency, reducing compilation overhead for projects not requiring its full functionality.",
    "Translate remaining critical Python and shell scripts into Rust, focusing on those executed frequently during the build or development cycle, to eliminate interpreter overhead and leverage Rust's performance and type safety.",
    "Fully implement and integrate the `rollup.lock` caching mechanism, including file system monitoring, hashing, and Git status optimization, to minimize redundant computations and recompilations.",
    "Address all compiler warnings across the workspace, ensuring `deny(warnings)` can be enabled for all crates.",
    "Explore and implement further optimizations such as incremental compilation improvements, linker optimizations, and potentially using `sccache` or similar tools.",
    "Continuously monitor compile times and warning counts to track progress and identify new areas for improvement."
]
related_binaries = [
    "tools/rustc_cargo_git_equivalence.rs", # Module, but relevant
    "tools/cargo_toml_extractor.rs", # Module, but relevant
    "crates/solana-monster-system/src/bin/cargo_lock_analyzer.rs",
    "crates/solana-monster-system/src/bin/package_record_extractor.rs",
    "crates/solana-monster-system/src/bin/fixed_dependency_analyzer.rs",
    "crates/solana-monster-system/src/bin/dependency_chain_analyzer.rs",
    "crates/solana-monster-system/src/bin/real_build_order.rs",
    "crates/solana-monster-system/src/bin/fast_build_order.rs",
    "crates/solana-monster-system/src/bin/rustc_build_order.rs",
    "crates/solana-monster-system/src/bin/solana_rustc_build_order.rs",
    "crates/solana-monster-system/src/bin/rustc_usage_resolver.rs",
    "crates/solana-monster-system/src/bin/cargo_crates_cas_db2.rs"
]
