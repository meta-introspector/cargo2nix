# tasks/toml/10_rocksdb_query_and_analysis.toml
#
# This task defines the process for querying and analyzing the data stored
# in the RocksDB database by the `rust-src-scanner`.

[task]
name = "RocksDB Query and Analysis of Inductive Declarations"
description = "Develop a utility or extend `rust-src-scanner` to query the RocksDB database, allowing for specific searches based on declaration kind, name, bit size, value, or assigned monster factors. Generate reports or visualizations from this data."
priority = "medium"
status = "pending"
assignee = "Gemini"
due_date = "2025-12-10"

[steps]
step_1 = { description = "Design and implement a CLI sub-command or a separate utility within `rust-src-scanner` for querying the `inductive_decls.rocksdb`.", command = "design_rocksdb_query_tool.sh" }
step_2 = { description = "Implement query functionalities: by declaration kind, by name (exact or regex), by bit_size range, by exact value, and by presence of specific monster factors.", command = "implement_query_features.sh" }
step_3 = { description = "Add reporting capabilities to present the query results in a human-readable format (e.g., CSV, JSON, or a formatted text report).", command = "implement_reporting.sh" }
step_4 = { description = "Create test cases to verify various query scenarios and ensure accurate data retrieval and filtering from RocksDB.", command = "add_query_tests.sh" }
step_5 = { description = "Execute the query tool against the `inductive_decls.rocksdb` generated by previous steps and verify the reports.", command = "verify_query_reports.sh" }

[output]
query_results_json = "/tmp/rust_scanner_output/query_results.json"
analysis_report = "/tmp/rust_scanner_output/analysis_report.md"

[dependencies]
rust_src_scanner_compiled = true
07_verify_inductive_declarations = true
08_refine_inductive_declarations_complex_types = true
09_refine_inductive_declarations_let_bindings = true
]
related_binaries = [
    "crates/solana-monster-system/src/bin/ast_decls_cas_db3.rs",
    "crates/solana-monster-system/src/bin/cargo_crates_cas_db2.rs",
    "crates/solana-monster-system/src/bin/meme_pda_storage.rs",
    "crates/solana-monster-system/src/bin/monster_fiber_bundle.rs",
    "crates/solana-monster-system/src/bin/monster_rocksdb_similarity.rs",
    "crates/solana-monster-system/src/bin/phi_rocksdb_storage.rs"
]
"