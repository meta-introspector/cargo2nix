    "crates/solana-monster-system/src/bin/cargo_git_mapper.rs",
    "crates/solana-monster-system/src/bin/recursive_git_url_checker.rs",
    "crates/solana-monster-system/src/bin/thorough_submodule_scanner.rs",
    "crates/solana-monster-system/src/bin/gitmodules_analyzer.rs"
]
