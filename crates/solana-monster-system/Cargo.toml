[package]
name = "solana-monster-system"
version = "0.1.0"
edition = "2021"

[dependencies]
aho-corasick= "1.1.4"
anyhow= "1.0.100"
block-buffer= "0.10.4"
camino= "1.2.1"
cargo-platform= "0.3.1"
cargo="0.92.0" # 94
cargo_metadata= "0.23.1"
cfg-if= "1.0.4"
clap = "4.5.53"
clap_complete="4.5.61"
clap_derive="4.5.49"
colorify="0.2.3"
cpufeatures= "0.2.17"
crypto-common= "0.1.6"
digest= "0.10.7"
equivalent= "1.0.2"
fs_extra="1.3.0"
generic-array= "0.14.9"
git2="0.20.2"
hashbrown= "0.16.1"
hex= "0.4.3"
indexmap= "2.12.1"
itoa= "1.0.15"
lazy_static="1.5.0"
libc= "0.2.177"
md5="0.8.0"
memchr= "2.7.6"
pathdiff= "0.2.3"
proc-macro2 = { workspace = true }
quote= "1.0.42"
regex-automata= "0.4.13"
regex-syntax= "0.8.8"
regex= "1.12.2"
ryu= "1.0.20"
same-file= "1.0.6"
semver= "1.0.27"
serde= { version = "1.0", features = ["derive"] }
serde_core= "1.0.228"
serde_derive= "1.0.228"
serde_json= "1.0"
sha1= "0.10.6"
sha2="0.10.9"
syn= "2.0.110"
tempfile="3.23.0"
tera="1.20.1"
thiserror-impl= "2.0.17"
thiserror= "2.0.17"
toml="0.9.8"
toml_datetime= "0.7.3"
toml_edit= "0.23.7"
toml_parser= "1.0.4"
toml_writer= "1.0.4"
cargo-repo-sync-lib = { path = "../../tools/cargo-repo-sync-lib" }
git-wrapper-lib = { path = "../../tools/git-wrapper-lib" }
#cargo-submodule-tool-lib = { path = "../../tools/cargo-submodule-tool-lib" }
typenum= "1.19.0"
unicode-ident= "1.0.22"
url="2.5.7"
version_check= "0.9.5"
walkdir= "2.5.0"
async-graphql = "7.0"
tokio = { version = "1.0", features = ["full"] }
tool-traits-lib = { path = "../../tools/tool-traits-lib", features = [
#    "anyhow_enabled",
    "serde_enabled",
    "serde_json_enabled",
    "regex_enabled",
    "walkdir_enabled",
    "clap_enabled",
    "cargo_metadata_enabled",
    "sha1_enabled",
    "pathdiff_enabled",
    "hex_enabled",
    "git2_enabled"
]}
real-toml-adapter-lib = { path = "../../tools/real-toml-adapter-lib", features = ["toml_edit_enabled"] }
real-regex-adapter-lib = { path = "../../tools/real-regex-adapter-lib" }
real-walkdir-adapter-lib = { path = "../../tools/real-walkdir-adapter-lib", features = ["walkdir_enabled"] }
rocksdb = "0.21.0"

[build-dependencies]

[[bin]]
name = "self_hosted_solana_system"
path = "src/bin/self_hosted_solana_system.rs"

[[bin]]
name = "semantic_analyzer"
path = "src/bin/semantic_analyzer.rs"
