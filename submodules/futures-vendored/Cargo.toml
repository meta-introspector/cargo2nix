[package]
name = "futures"
version = "0.3.31"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
license = "MIT OR Apache-2.0"
description = "An implementation of futures and streams featuring zero allocations, composability, and iterator-like interfaces."
repository = "https://github.com/rust-lang/futures-rs"
homepage = "https://rust-lang.github.io/futures-rs"
edition = "2018"

[dependencies]
futures-channel = { path = "../futures-rs/futures-channel", version = "0.4.0-alpha.0", default-features = false, features = ["sink"] }
futures-core = { path = "../futures-rs/futures-core", version = "1.0.0-alpha.0", default-features = false }
futures-executor = { path = "../futures-rs/futures-executor", version = "0.4.0-alpha.0", default-features = false, optional = true }
futures-io = { path = "../futures-rs/futures-io", version = "0.3.31", default-features = false }
futures-sink = { path = "../futures-rs/futures-sink", version = "0.4.0-alpha.0", default-features = false }
futures-task = { path = "../futures-rs/futures-task", version = "0.4.0-alpha.0", default-features = false }
futures-util = { path = "../futures-rs/futures-util", version = "0.4.0-alpha.0", default-features = false, features = ["sink"] }

[dev-dependencies]
assert_matches = "1.3.0"
pin-project = "1.0.11"
static_assertions = "1"
tokio = "0.1.11"

[features]
alloc = ["futures-core/alloc", "futures-task/alloc", "futures-sink/alloc", "futures-channel/alloc", "futures-util/alloc"]
async-await = ["futures-util/async-await", "futures-util/async-await-macro"]
bilock = ["futures-util/bilock"]
cfg-target-has-atomic = []
compat = ["std", "futures-util/compat"]
default = ["std", "async-await", "executor"]
executor = ["std", "futures-executor/std"]
io-compat = ["compat", "futures-util/io-compat"]
std = ["alloc", "futures-core/std", "futures-io/std", "futures-sink/std", "futures-task/std", "futures-util/std", "futures-util/channel", "futures-util/io"]
thread-pool = []
unstable = []
write-all-vectored = []
