[package]
name = "multer"
version = "3.1.0"
authors = ["Sergio Benitez", "Rousan Ali"]
edition = "2018"
description = "An async parser for `multipart/form-data` content-type in Rust."
license = "MIT"
repository = "https://github.com/rwf2/multer"
documentation = "https://docs.rs/multer/3.1.0"

[dependencies]
bytes = "1.0"
encoding_rs = "0.8.20"
futures-util = { path = "../futures-rs/futures-util" } # Redirected to vendored
http = "1.0"
httparse = "1.3"
memchr = "2.4"
mime = "0.3.10"
spin = "0.9"

[features]
default = []
log = ["dep:log"]
serde = ["dep:serde", "dep:serde_json"]
tokio = ["dep:tokio", "dep:tokio-util"]

[dependencies.log]
version = "0.4.15"
optional = true

[dependencies.serde]
version = "1.0"
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.tokio]
version = "1.0"
optional = true

[dependencies.tokio-util]
version = "0.7"
optional = true
