[workspace]
members = [
    "crates/self_heal",
    "crates/self_heal_macros",
    "crates/self_heal_nix",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Gemini"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/meta-introspector/rust-self-heal-core" # Placeholder
description = "Core libraries for the Rust self-healing build system."

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
toml_edit = "0.21"
