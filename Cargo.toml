heapless = { git = "https://github.com/meta-introspector/heapless", branch = "feature/CRQ-016-nixify" }
faster-hex = { git = "https://github.com/meta-introspector/faster-hex", branch = "feature/CRQ-016-nixify" }
dlv-list = { git = "https://github.com/meta-introspector/dlv-list-rs", branch = "feature/CRQ-016-nixify" }
