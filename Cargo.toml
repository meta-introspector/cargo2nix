[package]
edition = "2021"
license = "MIT"
name = "cargo2nix"
version = "0.12.0"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = {version = "1.0.75", features = ["backtrace"]}
#cargo = { git = "https://github.com/meta-introspector/cargo", branch = "feature/CRQ-016-nixify" }
cargo = "*"
cargo-platform = "0.2.0"
clap = {version = "4.4.6", features = ["derive"]}
clap_complete = {version = "4.4.3"}
#config   = "0.15.18"
colorify = "0.2.3"
pathdiff = "0.2.1"
semver = "1.0.20"
serde = {version = "1.0.189", features = ["derive"]}
sha2 = "0.10.8"
tempfile = "3.8.0"
tera = {version = "1.19.1", default-features = false}
toml = "0.9.8"
rust-ini = { git = "https://github.com/meta-introspector/rust-ini", branch = "feature/CRQ-016-nixify" }
ordered-multimap = { git = "https://github.com/meta-introspector/ordered-multimap-rs", branch = "feature/CRQ-016-nixify" }
heapless = { git = "https://github.com/meta-introspector/heapless", branch = "feature/CRQ-016-nixify" }
faster-hex = { git = "https://github.com/meta-introspector/faster-hex", branch = "feature/CRQ-016-nixify" }
dlv-list = { git = "https://github.com/meta-introspector/dlv-list-rs", branch = "feature/CRQ-016-nixify" }
walkdir = "2.5.0"
time-macros = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify", features = ["default", "formatting", "large-dates", "parsing", "serde"] }
time = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify", features = ["default", "alloc", "formatting", "large-dates", "local-offset", "macros", "parsing", "quickcheck", "serde-human-readable", "serde-well-known", "std", "rand", "serde", "wasm-bindgen"] }

base64 = { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/rust-base64" }
ron = "*" # { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/ron-rs" }
config = { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/config-rs" }
dashmap = { git = "https://github.com/meta-introspector/dashmap", branch = "feature/CRQ-016-nixify" }
hashbrown = { git = "https://github.com/meta-introspector/hashbrown", branch = "feature/CRQ-016-nixify" }
allocator-api2 = { git = "https://github.com/meta-introspector/allocator-api2", branch = "feature/CRQ-016-nixify" }
#curl = "*"

#[patch.crates-io]
#time-macros = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify", features = [ "default", "formatting", "large-dates",   "parsing",   "serde" ] }
#time = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify", features = [  "default", "alloc", "formatting", "large-dates", "local-offset", "macros", "parsing", "quickcheck", "serde-human-readable", "serde-well-known", "std", "rand", "serde",  "wasm-bindgen"] }
#base64 = { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/rust-base64" }
#ron = { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/ron-rs" }
#hashbrown = { git = "https://github.com/meta-introspector/hashbrown", branch = "feature/CRQ-016-nixify" }
#allocator-api2 = { git = "https://github.com/meta-introspector/allocator-api2", branch = "feature/CRQ-016-nixify", version = "0.3.1" }

##cargo = { git = "https://github.com/meta-introspector/cargo", branch = "feature/CRQ-016-nixify" }
#rust-ini = { git = "https://github.com/meta-introspector/rust-ini", branch = "feature/CRQ-016-nixify" }
#ordered-multimap = { git = "https://github.com/meta-introspector/ordered-multimap-rs", branch = "feature/CRQ-016-nixify" }
#heapless = { git = "https://github.com/meta-introspector/heapless", branch = "feature/CRQ-016-nixify" }
#faster-hex = { git = "https://github.com/meta-introspector/faster-hex", branch = "feature/CRQ-016-nixify" }
#dlv-list = { git = "https://github.com/meta-introspector/dlv-list-rs", branch = "feature/CRQ-016-nixify" }
##base64 = "0.22.1"
##time-macros = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify" }
##time = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify" }
##    23 - time-macros = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify" }
[workspace]
members = ["tools/repo_manager",
	  "tools/cargo-repo-sync",
	  "tools/cargo-vendormod"	
	]
#members = ["submodules/cargo/cargo-submodule-tool"]

[workspace.dependencies]
#path = "time-core",
time-core = {  version = "=0.1.6" }
#path = "time-macros", 
time-macros = { version = "=0.2.24" }

criterion = { version = "0.5.1", default-features = false }
deranged = { version = "0.5.2", features = ["powerfmt"] }
itoa = "1.0.1"
js-sys = "0.3.58"
libc = "0.2.98"
num-conv = "0.1.0"
num_threads = "0.1.2"
powerfmt = { version = "0.2.0", default-features = false }
quickcheck = { version = "1.0.3", default-features = false }
quickcheck_macros = "1.0.0"
rand08 = { package = "rand", version = "0.8.4", default-features = false }
rand09 = { package = "rand", version = "0.9.2", default-features = false }
rstest = { version = "0.23.0", default-features = false }
rstest_reuse = "0.7.0"
# ^1.0.184 due to serde-rs/serde#2538
serde = { version = "1.0.184", default-features = false }
serde_core = { version = "1.0.220", default-features = false }
serde_json = "1.0.68"
serde_test = "1.0.126"
trybuild = "1.0.102"


[workspace.lints.rust]
ambiguous-glob-reexports = "deny"
clashing-extern-declarations = "deny"
const-item-mutation = "deny"
dangling-pointers-from-temporaries = "deny"
deref-nullptr = "deny"
drop-bounds = "deny"
future-incompatible = "deny"
hidden-glob-reexports = "deny"
improper-ctypes = "deny"
improper-ctypes-definitions = "deny"
invalid-from-utf8 = "deny"
invalid-macro-export-arguments = "deny"
invalid-nan-comparisons = "deny"
invalid-reference-casting = "deny"
invalid-value = "deny"
named-arguments-used-positionally = "deny"
non-ascii-idents = "deny"
opaque-hidden-inferred-bound = "deny"
overlapping-range-endpoints = "deny"
suspicious-double-ref-op = "deny"
unconditional-recursion = "deny"
unexpected_cfgs = { level = "deny", check-cfg = [
    "cfg(__ui_tests)",
    "cfg(bench)",
] }
unnameable-test-items = "deny"
unsafe-op-in-unsafe-fn = "deny"
unstable-syntax-pre-expansion = "deny"

keyword-idents = "warn"
let-underscore = "warn"
macro-use-extern-crate = "warn"
meta-variable-misuse = "warn"
missing-abi = "warn"
missing-copy-implementations = "warn"
missing-debug-implementations = "warn"
missing-docs = "warn"
noop-method-call = "warn"
single-use-lifetimes = "warn"
trivial-casts = "warn"
trivial-numeric-casts = "warn"
unreachable-pub = "warn"
unused = { level = "warn", priority = -1 }
unused-import-braces = "warn"
unused-lifetimes = "warn"
unused-qualifications = "warn"
variant-size-differences = "warn"

unstable-name-collisions = { level = "allow", priority = 1 } # overrides #![deny(future_incompatible)], temporary while `.cast_{un}signed()` is unstable

[workspace.lints.clippy]
alloc-instead-of-core = "deny"
std-instead-of-core = "deny"
undocumented-unsafe-blocks = "deny"

all = { level = "warn", priority = -1 }
as-underscore = "warn"
dbg-macro = "warn"
decimal-literal-representation = "warn"
explicit-auto-deref = "warn"
get-unwrap = "warn"
manual-let-else = "warn"
missing-docs-in-private-items = "warn"
missing-enforced-import-renames = "warn"
nursery = { level = "warn", priority = -1 }
obfuscated-if-else = "warn"
print-stdout = "warn"
semicolon-outside-block = "warn"
todo = "warn"
unimplemented = "warn"
uninlined-format-args = "warn"
unnested-or-patterns = "warn"
unwrap-in-result = "warn"
unwrap-used = "warn"
use-debug = "warn"

option-if-let-else = { level = "allow", priority = 1 }     # suggests terrible code, overrides #![warn(clippy::nursery)]
redundant-pub-crate = { level = "allow", priority = 1 }    # rust-lang/rust-clippy#5369, overrides #![warn(clippy::nursery)]
uninhabited-references = { level = "allow", priority = 1 } # rust-lang/rust-clippy#11984
incompatible-msrv = { level = "allow", priority = 1 }      # rust-lang/rust-clippy#12280

[workspace.lints.rustdoc]
private-doc-tests = "warn"
unescaped-backticks = "warn"

