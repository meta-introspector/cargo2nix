[package]
edition = "2021"
license = "MIT"
name = "cargo2nix"
version = "0.12.0"

[dependencies]
anyhow = {version = "1.0.75", features = ["backtrace"]}
#cargo = { git = "https://github.com/meta-introspector/cargo", branch = "feature/CRQ-016-nixify" }
cargo = "*"
cargo-platform = "0.3.1"
clap = {version = "4.4.6", features = ["derive"]}
clap_complete = {version = "4.4.3"}
#config   = "0.15.18"
colorify = "0.2.3"
pathdiff = "0.2.1"
semver = "1.0.20"
serde = {version = "1.0.189", features = ["derive"]}
sha2 = "0.10.8"
tempfile = "3.8.0"
tera = {version = "1.19.1", default-features = false}
toml = "0.9.8"
rust-ini = { git = "https://github.com/meta-introspector/rust-ini", branch = "feature/CRQ-016-nixify" }
ordered-multimap = { git = "https://github.com/meta-introspector/ordered-multimap-rs", branch = "feature/CRQ-016-nixify" }
heapless = { git = "https://github.com/meta-introspector/heapless", branch = "feature/CRQ-016-nixify" }
faster-hex = { git = "https://github.com/meta-introspector/faster-hex", branch = "feature/CRQ-016-nixify" }
dlv-list = { git = "https://github.com/meta-introspector/dlv-list-rs", branch = "feature/CRQ-016-nixify" }

time-macros = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify", features = ["default", "formatting", "large-dates", "parsing", "serde"] }
time = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify", features = ["default", "alloc", "formatting", "large-dates", "local-offset", "macros", "parsing", "quickcheck", "serde-human-readable", "serde-well-known", "std", "rand", "serde", "wasm-bindgen"] }

base64 = { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/rust-base64" }
ron = { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/ron-rs" }
config = { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/config-rs" }
dashmap = { git = "https://github.com/meta-introspector/dashmap", branch = "feature/CRQ-016-nixify" }
hashbrown = { git = "https://github.com/meta-introspector/hashbrown", branch = "feature/CRQ-016-nixify" }
allocator-api2 = { git = "https://github.com/meta-introspector/allocator-api2", branch = "feature/CRQ-016-nixify" }

[patch.crates-io]
time-macros = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify", features = [ "default", "formatting", "large-dates",   "parsing",   "serde" ] }
time = { git = "https://github.com/meta-introspector/time-rs", branch = "feature/CRQ-016-nixify", features = [  "default", "alloc", "formatting", "large-dates", "local-offset", "macros", "parsing", "quickcheck", "serde-human-readable", "serde-well-known", "std", "rand", "serde",  "wasm-bindgen"] }
base64 = { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/rust-base64" }
ron = { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/ron-rs" }
config = { branch = "feature/CRQ-016-nixify",      git = "https://github.com/meta-introspector/config-rs" }
hashbrown = { git = "https://github.com/meta-introspector/hashbrown", branch = "feature/CRQ-016-nixify" }

#cargo = { git = "https://github.com/meta-introspector/cargo", branch = "feature/CRQ-016-nixify" }
rust-ini = { git = "https://github.com/meta-introspector/rust-ini", branch = "feature/CRQ-016-nixify" }
