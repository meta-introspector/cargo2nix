[workspace]
members = [
    "submodules/cargo",
]

[workspace.package]
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/meta-introspector/cargo2nix"
repository = "https://github.com/meta-introspector/cargo2nix"

[workspace.dependencies]
annotate-snippets = { version = "0.12.8", features = ["simd"] }
anstream = "0.6.21"
anstyle = "1.0.13"
anyhow = "1.0.100"
base64 = "0.22.1"
blake3 = "1.8.2"
build-rs = { version = "0.3.1", path = "crates/build-rs" }
cargo = { path = "" }
cargo-credential = { version = "0.4.2", path = "submodules/cargo/credential/cargo-credential" }
cargo-credential-libsecret = { version = "0.5.4", path = "submodules/cargo/credential/cargo-credential-libsecret" }
cargo-credential-macos-keychain = { version = "0.4.19", path = "submodules/cargo/credential/cargo-credential-macos-keychain" }
cargo-credential-wincred = { version = "0.4.19", path = "submodules/cargo/credential/cargo-credential-wincred" }
cargo-platform = { path = "submodules/cargo/crates/cargo-platform", version = "0.3.0" }
cargo-test-macro = { version = "0.4.8", path = "submodules/cargo/crates/cargo-test-macro" }
cargo-test-support = { version = "0.9.1", path = "submodules/cargo/crates/cargo-test-support" }
cargo-util = { version = "0.2.26", path = "submodules/cargo/crates/cargo-util" }
cargo-util-schemas = { version = "0.10.3", path = "submodules/cargo/crates/cargo-util-schemas" }
cargo_metadata = "0.23.0"
clap = "*"
clap_complete = { version = "4.5.60", features = ["unstable-dynamic"] }
color-print = "0.3.7"
core-foundation = { version = "0.10.1", features = ["mac_os_10_7_support"] }
deranged-macros = { version = "0.3.0", path = "submodules/deranged/deranged-macros" }
crates-io = { version = "0.40.16", path = "submodules/cargo/crates/crates-io" }
criterion = { version = "0.7.0", features = ["html_reports"] }
curl = "*"
curl-sys = "0.4.84+curl-8.17.0"
filetime = "0.2.26"
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
git2 = "0.20.2"
git2-curl = "0.21.0"
# When updating this, also see if `gix-transport` further down needs updating or some auth-related tests will fail.
gix = { version = "0.74.1", default-features = false, features = ["progress-tree", "parallel", "dirwalk", "status"] }
glob = "0.3.3"
# Pinned due to https://github.com/sunng87/handlebars-rust/issues/711
handlebars = { version = "=6.3.1", features = ["dir_source"] }
hex = "0.4.3"
hmac = "0.12.1"
home = "0.5.12"
http-auth = { version = "0.1.10", default-features = false }
ignore = "0.4.25"
im-rc = "15.1.0"
indexmap = "2.12.0"
itertools = "0.14.0"
jiff = { version = "0.2.15", default-features = false, features = [ "std" ] }
jobserver = "0.1.34"
libc = "0.2.177"
libgit2-sys = "0.18.2"
libloading = "0.8.9"
memchr = "2.7.6"
miow = "0.6.1"
opener = "0.8.3"
openssl = "0.10.74"
openssl-sys = "0.9.110"
os_info = { version = "3.12.0", default-features = false }
pasetors = { version = "0.7.7", features = ["v3", "paserk", "std", "serde"] }
powerfmt-macros = { version = "0.1.0", path = "submodules/powerfmt/powerfmt-macros" }
pathdiff = "0.2.3"
percent-encoding = "2.3.2"
pkg-config = "0.3.32"
proptest = "1.9.0"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
rand = "0.9.2"
regex = "1.12.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustc-hash = "2.1.1"
rustc-stable-hash = "0.1.2"
rustfix = { version = "0.9.2", path = "submodules/cargo/crates/rustfix" }
same-file = "1.0.6"
schemars = "1.0.5"
security-framework = "3.5.1"
semver = { version = "1.0.27", features = ["serde"] }
serde = "1.0.228"
serde_core = "1.0.228"
serde-untagged = "0.1.9"
serde-value = "0.7.0"
serde_ignored = "0.1.14"
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
shell-escape = "0.1.5"
similar = "2.7.0"
supports-hyperlinks = "3.1.0"
supports-unicode = "3.0.0"
snapbox = { version = "0.6.23", features = ["diff", "dir", "term-svg", "regex", "json"] }
tar = { version = "0.4.44", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["parsing", "formatting", "serde"] }
toml = { version = "0.9.8", default-features = false }
toml_edit = { version = "0.23.7", features = ["serde"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] } # be compatible with rustc_log: https://github.com/rust-lang/rust/blob/e51e98dde6a/compiler/rustc_log/Cargo.toml#L9
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
unicase = "2.8.1"
unicode-ident = "1.0.22"
unicode-width = "0.2.2"
url = "2.5.7"
varisat = "0.2.2"
walkdir = "2.5.0"
windows-sys = "0.61"
winnow = "0.7.13"

[workspace.lints.rust]
rust_2018_idioms = "warn" # TODO: could this be removed?

[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

[workspace.lints.clippy]
all = { level = "allow", priority = -2 }
correctness = { level = "warn", priority = -1 }
dbg_macro = "warn"
disallowed_methods = "warn"
print_stderr = "warn"
print_stdout = "warn"
self_named_module_files = "warn"

[patch.crates-io]
powerfmt = { path = "./submodules/powerfmt/powerfmt" }