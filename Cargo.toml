


[workspace.package]
categories = []
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
rust-version = "1.89"
edition = "2024"
#resolver = "3"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/meta-introspector/cargo2nix"
repository = "https://github.com/meta-introspector/cargo2nix"
keywords = ["rust"]
include = [
  "build.rs",
  "src/**/*",
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE*",
  "README.md",
  "examples/**/*"
]

[workspace]
resolver = "3"
members = [
    "crates/cargo2nix",
#    "submodules/h2",
    "tools/cargo-submodule-tool",
    "tools/dep2submodule",
    "tools/generate_workspace_deps",
    "tools/cargo-workspace-from-tree", "tools/secret-manager-rs",
    "tools/cargo-submodule-tool-lib",
    "tools/syn-adapter-lib",
    "tools/feature-permutation-builder",
    "tools/cargo-feature-adapter",
]
exclude = []




[workspace.lints.rust]
incomplete_features = "allow"
rust_2018_idioms = "allow" # TODO: could this be removed?
unexpected_cfgs = { level = "allow" }
# unexpected_cfgs = { level = "allow", check-cfg = [
#     'cfg(atomic_maybe_uninit_test_prefer_kuser_cmpxchg)',
#     'cfg(crossbeam_loom)',
#     'cfg(crossbeam_sanitize)',
#     'cfg(emulate_second_only_system)',
#     'cfg(tracing_unstable)',
#     'cfg(__powerfmt_docs)',
#     'cfg(xxx_debug_only_print_generated_code)',
#     'cfg(wasm_bindgen_unstable_test_coverage)',
#     'cfg(doctests)',
#     'cfg(raw_ref_macros)',
#     'cfg(allow_clippy)',
#     'cfg(tuple_ty)',
#     'cfg(maybe_uninit)',
#     'cfg(stable_const)',
#     'cfg(stable_offset_of)',
#     'cfg(feature, values("borsh"))',
#     'cfg(feature, values("sval"))',
#     'cfg(feature, values("rayon"))',
#     'cfg(feature, values("arbitrary"))',
#     'cfg(feature, values("quickcheck"))',
#     'cfg(feature, values("serde"))',
#     'cfg(feature, values("document-features"))',
#     'cfg(target_os, values("bitrig"))',
# ] }
unused_qualifications = "allow"
warnings = "allow"

[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

[workspace.lints.clippy]
all = { level = "allow", priority = -2 }
correctness = { level = "allow", priority = -1 }
dbg_macro = "allow"
disallowed_methods = "allow"
print_stderr = "allow"
print_stdout = "allow"
self_named_module_files = "allow"
explicit_iter_loop = "allow"
identity_op = "allow"
manual_assert = "allow"
map_unwrap_or = "allow"
missing_safety_doc = "allow"
non_minimal_cfg = "allow"
ptr_as_ptr = "allow"
unnecessary_semicolon = "allow"
expl_impl_clone_on_copy = "allow"
uninlined_format_args = "allow"
unnecessary_cast = "allow"
used_underscore_binding = "allow"

