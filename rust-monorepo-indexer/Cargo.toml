[workspace]
members = [
    "crates/indexer",
    "crates/analyzer",
    "crates/dashboard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Gemini"]

[workspace.dependencies]
# Add common dependencies here
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
