[package]
name = "cargo-llm-bootstrap"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = "0.4"
toml = "0.8"
syn = { version = "2.0", features = ["full"] }
walkdir = { workspace = true }

[[bin]]
name = "cargo-llm-bootstrap"
path = "src/main.rs"
