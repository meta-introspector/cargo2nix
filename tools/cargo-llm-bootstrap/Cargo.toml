[package]
name = "cargo-llm-bootstrap"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
cargo_metadata = "0.18"
thiserror = "1.0"
