[package]
name = "cargo-llm-bootstrap"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.23"
toml_edit = "0.22.11"
sha2 = "0.10.8"
cargo_metadata = "0.18"
thiserror = "1.0"
walkdir = "2.3"

chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
ctrlc = "3.4"
bincode = "1.3"

# Future dependencies for advanced semantic analysis, LMFDB integration,
# and eigenmatrix construction (e.g., nalgebra, petgraph) will be added here.
