[package]
name = "cargo-llm-bootstrap"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
chrono = "0.4"
toml = { workspace = true }
syn = { workspace = true, features = ["full"] }
walkdir = { workspace = true }
quote = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "cargo-llm-bootstrap"
path = "src/main.rs"
