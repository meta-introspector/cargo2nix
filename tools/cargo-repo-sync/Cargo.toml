[package]
name = "cargo-repo-sync"
version = "0.1.0"
edition = "2021" # Using 2021 edition for new Rust projects

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml_edit = "0.23"
walkdir = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
regex = "1"
lazy_static = "1"
serde_json = "1"
pathdiff = "0.2.1"
md5 = "0.7"
git2 = "0.19"
sha1 = "0.10"
lru = "0.12" # Add lru crate for LRU cache # Use sha1 crate for SHA-1 hashing # Add git2 crate for direct Git operations
sha2 = "0.10"
cargo2nix = { path = "../../" }
cargo_metadata = "0.18"

[lib]
path = "src/lib.rs"

[package.metadata.repo-manager] # Keeping this for now, will adapt as needed
git_path = "/data/data/com.termux.nix/files/home/.nix-profile/bin/git"
gh_path = "/data/data/com.termux.nix/files/home/.nix-profile/bin/gh"
