[package]
name = "cargo-repo-sync"
version = "0.1.0"
edition = "2021" # Using 2021 edition for new Rust projects

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml_edit = "0.23"
walkdir = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
regex = "1"
lazy_static = "1"
serde_json = "1"
pathdiff = "0.2.1"

[package.metadata.repo-manager] # Keeping this for now, will adapt as needed
git_path = "/data/data/com.termux.nix/files/home/.nix-profile/bin/git"
gh_path = "/data/data/com.termux.nix/files/home/.nix-profile/bin/gh"
