[package]
name = "rust-src-scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
walkdir = "2.5.0"
syn = { version = "2.0.110", features = ["full", "extra-traits", "visit"] }
petgraph = "0.6.4"
clap = "4.5.53"
toml = "0.8.11"
chrono = "0.4.38"
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.100"
rocksdb = "0.21.0"
proc-macro2 = { workspace = true }
quote = { workspace = true }

# Future dependencies for advanced semantic analysis, LMFDB integration,
# and eigenmatrix construction (e.g., nalgebra, petgraph) will be added here.

[features]
disable-eigenvector = []