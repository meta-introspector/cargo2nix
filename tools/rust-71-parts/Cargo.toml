[package]
name = "rust-71-parts"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
quote = "1.0"
proc-macro2 = "1.0"
sha2 = "0.10"
hex = "0.4"
bincode = "1.3"
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
rocksdb = "0.22"
juniper = "0.16"

tempfile = "3.0"

[[bin]]
name = "monster_cloudformation_generator"
path = "src/bin/monster_cloudformation_generator.rs"

[[bin]]
name = "monster_oci_generator"
path = "src/bin/monster_oci_generator.rs"

[[bin]]
