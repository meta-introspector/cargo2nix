[package]
name = "repo_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml_edit = "0.23"
walkdir = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
regex = "1"
lazy_static = "1"
serde_json = "1" # Added for JSON serialization

[package.metadata.repo-manager]
git_path = "/data/data/com.termux.nix/files/home/.nix-profile/bin/git"
gh_path = "/data/data/com.termux.nix/files/home/.nix-profile/bin/gh"
